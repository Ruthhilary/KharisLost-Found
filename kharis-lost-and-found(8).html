<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5B4FCF">
<title>Kharis Lost &amp; Found</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<style>
  :root{
    --purple:#5B4FCF;
    --purple-dark:#463EA8;
    --purple-tint:#F0EFFB;
    --purple-tint-2:#E4E1F7;
    --bg:#F5F5F8;
    --card:#FFFFFF;
    --ink:#1B1D29;
    --muted:#6C7086;
    --line:#E7E7EF;
    --green:#188A54;
    --green-tint:#E6F6EE;
    --amber:#B4700F;
    --amber-tint:#FBEFDC;
    --red:#B93434;
    --red-tint:#FCEAEA;
    --blue:#2E5BB8;
    --blue-tint:#EAF0FC;
    --radius:12px;
    --radius-sm:8px;
    --shadow:0 1px 2px rgba(20,15,50,.04), 0 6px 18px rgba(20,15,50,.06);
  }
  [data-theme="dark"]{
    color-scheme:dark;
    --purple:#6F63E6; --purple-dark:#AAA2FF; --purple-tint:#211E3D; --purple-tint-2:#2D2957;
    --bg:#0E0E16; --card:#171722; --ink:#EEEEF6; --muted:#9A9BB3; --line:#262638;
    --green:#4FCB8C; --green-tint:#10261C; --amber:#E9A94B; --amber-tint:#2B2010;
    --red:#F27C7C; --red-tint:#2C1616; --blue:#7EA5F2; --blue-tint:#16203A;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.28);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; min-height:100vh; transition:background .2s,color .2s;}
  h1,h2,h3,h4{font-family:'Plus Jakarta Sans',system-ui,sans-serif; margin:0; letter-spacing:-0.01em;}
  p{margin:0;}
  button{font-family:inherit; cursor:pointer;}
  svg{display:block;}
  .ic{display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;}
  ::selection{background:var(--purple-tint-2);}

  /* ---------- Topbar (scrolls away) + slim sticky tab bar ---------- */
  #topbar, #tabsBar{display:none;}
  body.authed #topbar{display:flex;}
  body.authed #tabsBar{display:block; position:sticky;}
  .topbar{align-items:center; gap:12px; padding:12px 26px; max-width:1180px; margin:0 auto;}
  .brand{display:flex; align-items:center; gap:9px; font-family:'Plus Jakarta Sans'; font-weight:800; font-size:14.5px; white-space:nowrap;}
  .brand-mark{width:28px; height:28px; border-radius:8px; background:linear-gradient(155deg,var(--purple),var(--purple-dark)); display:flex; align-items:center; justify-content:center; color:#fff; box-shadow:var(--shadow); flex-shrink:0;}
  [data-theme="dark"] .brand-mark, [data-theme="dark"] .auth-logo{background:linear-gradient(155deg,#7A6EF0,#4A3FB8);}
  .topbar-spacer{flex:1;}
  .tabs-bar{position:sticky; top:0; z-index:30; background:rgba(245,245,248,.88); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-bottom:1px solid var(--line); border-top:1px solid var(--line);}
  [data-theme="dark"] .tabs-bar{background:rgba(14,14,22,.86);}
  .tabs{display:flex; gap:2px; max-width:1180px; margin:0 auto; padding:5px 22px; overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch;}
  .tabs::-webkit-scrollbar{display:none;}
  .tabs-bar{position:sticky;}
  .tab-arrow{position:absolute; top:0; bottom:0; width:38px; border:none; color:var(--ink); font-size:22px; line-height:1; z-index:2; display:none; align-items:center; padding:0 0 3px; cursor:pointer;}
  .tab-arrow.left{left:0; justify-content:flex-start; padding-left:8px; background:linear-gradient(90deg,var(--bg) 40%,transparent);}
  .tab-arrow.right{right:0; justify-content:flex-end; padding-right:8px; background:linear-gradient(270deg,var(--bg) 40%,transparent);}
  .tab-arrow.show{display:flex;}
  .tab-arrow:hover{color:var(--purple);}
  .tab-btn{border:none; background:transparent; color:var(--muted); padding:7px 12px; border-radius:8px; font-size:13px; font-weight:600; white-space:nowrap; transition:.15s; display:flex; align-items:center; gap:6px; flex-shrink:0;}
  .tab-btn:hover{color:var(--ink); background:var(--purple-tint);}
  .tab-btn.active{background:var(--purple); color:#fff;}
  .tab-btn:focus-visible, button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{outline:2.5px solid var(--purple); outline-offset:2px;}
  .tab-btn .badge-dot{background:var(--red); color:#fff; font-size:10px; font-weight:800; min-width:16px; height:16px; border-radius:8px; display:inline-flex; align-items:center; justify-content:center; padding:0 4px;}
  .tab-btn.active .badge-dot{background:#fff; color:#463EA8;}
  .skip-link{position:absolute; left:-999px; top:0; background:var(--purple); color:#fff; padding:10px 16px; border-radius:0 0 8px 0; z-index:200; font-weight:700; font-size:13px;}
  .skip-link:focus{left:0;}
  .sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;}

  /* ---------- Layout ---------- */
  main{max-width:1180px; margin:0 auto; padding:24px 26px 80px;}
  .page-head{margin-bottom:18px; display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap;}
  .page-head h1{font-size:19px; font-weight:700;}
  .page-head p{color:var(--muted); font-size:13px; margin-top:4px; max-width:620px;}
  .eyebrow{display:inline-flex; align-items:center; gap:6px; font-size:10.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--purple-dark); background:var(--purple-tint); padding:3px 9px; border-radius:6px; margin-bottom:7px;}

  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);}
  .grid-2{display:grid; grid-template-columns:1fr 1.3fr; gap:22px;}
  @media(max-width:840px){.grid-2{grid-template-columns:1fr;}}

  /* ---------- Report form ---------- */
  .report-form{padding:24px;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:13px; font-weight:600; margin-bottom:6px; color:var(--ink);}
  .field .hint{font-size:12px; color:var(--muted); margin-top:5px;}
  input[type=text], input[type=tel], textarea, select, input[type=email], input[type=url], input[type=password]{
    width:100%; border:1.5px solid var(--line); background:var(--bg); border-radius:var(--radius-sm);
    padding:10px 12px; font-size:14px; color:var(--ink); font-family:inherit; transition:.15s;
  }
  [data-theme="dark"] input, [data-theme="dark"] textarea, [data-theme="dark"] select{background:#15142280;}
  textarea{resize:vertical; min-height:78px;}
  input:focus, textarea:focus, select:focus{outline:none; border-color:var(--purple); background:var(--card); box-shadow:0 0 0 3px var(--purple-tint);}
  .photo-drop{border:1.5px dashed #B9B4E8; border-radius:var(--radius-sm); background:var(--purple-tint); padding:20px; text-align:center; cursor:pointer; position:relative; overflow:hidden;}
  [data-theme="dark"] .photo-drop{border-color:#4B4580;}
  .photo-drop.has-img{padding:0; border-style:solid;}
  .photo-drop img{width:100%; max-height:210px; object-fit:cover; display:block;}
  .photo-drop .drop-msg{color:var(--purple-dark); font-weight:600; font-size:13.5px; display:flex; align-items:center; justify-content:center; gap:8px;}
  .photo-drop .drop-sub{color:var(--muted); font-size:12px; margin-top:4px;}
  .photo-drop input{position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; font-size:16px; z-index:2;}
  .btn{border:none; border-radius:8px; padding:11px 18px; font-weight:700; font-size:14px; display:inline-flex; align-items:center; justify-content:center; gap:7px; transition:.15s;}
  .btn-primary{background:var(--purple); color:#fff; box-shadow:0 5px 14px rgba(91,79,207,.25);}
  .btn-primary:hover{background:var(--purple-dark);}
  .btn-block{width:100%;}
  .btn-secondary{background:var(--card); color:var(--ink); border:1.5px solid var(--line);}
  .btn-secondary:hover{border-color:#B9B4E8; background:var(--purple-tint);}
  .btn-green{background:var(--green); color:#fff;}
  .btn-green:hover{background:#146E43;}
  .btn-ghost-red{background:var(--red-tint); color:var(--red);}
  .btn-ghost-red:hover{background:#F6D6D6;}
  [data-theme="dark"] .btn-ghost-red{color:#F2A9A9;}
  [data-theme="dark"] .btn-ghost-red:hover{background:#4A2020;}
  .btn-sm{padding:7px 13px; font-size:12.5px; border-radius:7px;}
  .btn[disabled]{opacity:.5; cursor:not-allowed;}

  .report-preview{padding:24px; display:flex; flex-direction:column;}
  .preview-card{border:1.5px solid var(--line); border-radius:var(--radius-sm); overflow:hidden; margin-top:auto; margin-bottom:auto;}
  .preview-photo{height:190px; background:var(--purple-tint); color:var(--purple-dark); display:flex; align-items:center; justify-content:center;}
  .preview-photo img{width:100%; height:100%; object-fit:cover;}
  .preview-body{padding:15px;}
  .preview-body .name{font-weight:700; font-size:15.5px;}
  .preview-body .meta{color:var(--muted); font-size:12.5px; margin-top:4px;}

  /* ---------- Browse ---------- */
  .search-row{display:flex; gap:10px; margin-bottom:14px;}
  .search-row input{flex:1;}
  .pills{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px;}
  .pill{border:1.5px solid var(--line); background:var(--card); padding:7px 15px; border-radius:8px; font-size:13px; font-weight:600; color:var(--muted);}
  .pill.active{background:var(--purple); border-color:var(--purple); color:#fff;}
  .item-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:15px;}
  .item-card{cursor:pointer; overflow:hidden; transition:.15s;}
  .item-card:hover{transform:translateY(-2px); box-shadow:0 10px 22px rgba(20,15,50,.1);}
  .item-photo{height:135px; background:var(--purple-tint); color:var(--purple-dark); display:flex; align-items:center; justify-content:center; position:relative;}
  .item-photo img{width:100%; height:100%; object-fit:cover;}
  .status-badge{position:absolute; top:8px; right:8px; font-size:10.5px; font-weight:700; padding:4px 9px; border-radius:6px; background:var(--card); color:var(--muted); border:1px solid var(--line);}
  .status-available{color:var(--blue); background:var(--blue-tint); border-color:transparent;}
  .status-pending{color:var(--amber); background:var(--amber-tint); border-color:transparent;}
  .status-claimed{color:var(--green); background:var(--green-tint); border-color:transparent;}
  .status-donated{color:var(--amber); background:var(--amber-tint); border-color:transparent;}
  .item-info{padding:12px 13px;}
  .item-info .name{font-weight:700; font-size:14px;}
  .item-info .meta{color:var(--muted); font-size:12px; margin-top:3px;}
  .item-info .countdown{margin-top:6px; font-size:11px; color:var(--purple-dark); font-weight:600;}
  .empty-state{padding:56px 20px; text-align:center; color:var(--muted);}
  .empty-state .big{margin-bottom:10px; color:var(--muted); display:flex; justify-content:center;}

  /* ---------- Modal ---------- */
  .overlay{position:fixed; inset:0; background:rgba(15,12,30,.45); backdrop-filter:blur(2px); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px; opacity:0; pointer-events:none; transition:.18s;}
  .overlay.show{opacity:1; pointer-events:auto;}
  .modal{background:var(--card); border-radius:16px; width:460px; max-width:100%; max-height:88vh; overflow:auto; box-shadow:0 24px 60px rgba(10,5,30,.32); transform:translateY(10px); transition:.18s;}
  .overlay.show .modal{transform:translateY(0);}
  .modal-photo{height:200px; background:var(--purple-tint); color:var(--purple-dark); display:flex; align-items:center; justify-content:center; position:relative;}
  .modal-photo img{width:100%; height:100%; object-fit:cover;}
  .modal-close{position:absolute; top:12px; right:12px; width:30px; height:30px; border-radius:50%; border:none; background:var(--card); display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow); color:var(--ink);}
  .modal-body{padding:22px;}
  .modal-body h3{font-size:16.5px; font-weight:700;}
  .modal-body .meta-row{color:var(--muted); font-size:13px; margin-top:6px; display:flex; gap:14px; flex-wrap:wrap; align-items:center;}
  .meta-item{display:flex; align-items:center; gap:5px;}
  .modal-actions{margin-top:16px; display:flex; flex-direction:column; gap:9px;}
  .claim-box{margin-top:14px; border-top:1px solid var(--line); padding-top:14px;}
  .note-box{margin-top:14px; padding:12px 14px; border-radius:10px; font-size:13px; line-height:1.5; display:flex; gap:10px; align-items:flex-start;}
  .note-box .ic{margin-top:1px;}
  .note-blue{background:var(--blue-tint); color:#25428F;}
  .note-amber{background:var(--amber-tint); color:#8A5A0C;}
  .note-green{background:var(--green-tint); color:#0F6538;}
  .note-red{background:var(--red-tint); color:#8F2A2A;}
  [data-theme="dark"] .note-blue{color:#AFC7F5;}
  [data-theme="dark"] .note-amber{color:#F0C787;}
  [data-theme="dark"] .note-green{color:#8FDBAF;}
  [data-theme="dark"] .note-red{color:#F2A9A9;}
  .qa-thread{margin-top:14px; border-top:1px solid var(--line); padding-top:14px; display:flex; flex-direction:column; gap:10px;}
  .qa-q, .qa-a{padding:10px 12px; border-radius:10px; font-size:13px; line-height:1.5;}
  .qa-q{background:var(--bg);}
  .qa-a{background:var(--purple-tint); margin-left:14px;}
  .qa-label{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); margin-bottom:3px;}

  /* ---------- Stats / Dashboard ---------- */
  .stat-row{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:24px;}
  @media(max-width:700px){.stat-row{grid-template-columns:repeat(2,1fr);}}
  .stat{padding:14px 16px; display:flex; align-items:center; gap:13px;}
  .stat-icon{width:38px; height:38px; border-radius:9px; background:var(--purple-tint); color:var(--purple-dark); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .stat .num{font-family:'Plus Jakarta Sans'; font-size:20px; font-weight:700; line-height:1;}
  .stat .lbl{color:var(--muted); font-size:12px; margin-top:3px; font-weight:600;}
  .welcome-card{padding:20px 24px; margin-bottom:18px; display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap; background:linear-gradient(155deg,var(--purple),var(--purple-dark)); color:#fff; border:none; box-shadow:0 10px 26px rgba(91,79,207,.28);}
  .welcome-card h1{color:#fff; font-size:18px; font-weight:700;}
  .welcome-card p{color:#E4E1FA; font-size:13px; margin-top:4px;}
  .welcome-actions{display:flex; gap:10px; flex-wrap:wrap;}
  .welcome-card .btn-secondary{background:rgba(255,255,255,.14); color:#fff; border:1.5px solid rgba(255,255,255,.3);}
  .welcome-card .btn-secondary:hover{background:rgba(255,255,255,.24);}
  .quick-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px; margin-bottom:26px;}
  .quick-card{padding:18px; display:flex; flex-direction:column; gap:10px; text-align:left; background:var(--card); border:1px solid var(--line); cursor:pointer; transition:.15s;}
  .quick-card:hover{border-color:var(--purple); transform:translateY(-2px);}
  .quick-icon{width:36px; height:36px; border-radius:9px; background:var(--purple-tint); color:var(--purple-dark); display:flex; align-items:center; justify-content:center;}
  .quick-card .t{font-weight:700; font-size:13.5px;}
  .quick-card .d{color:var(--muted); font-size:12.5px;}
  .activity-row{display:flex; align-items:center; gap:13px; padding:13px 18px; border-bottom:1px solid var(--line); font-size:13.5px;}
  .activity-row:last-child{border-bottom:none;}
  .activity-icon{width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .activity-icon.green{background:var(--green-tint); color:var(--green);}
  .activity-icon.amber{background:var(--amber-tint); color:var(--amber);}
  .activity-icon.blue{background:var(--blue-tint); color:var(--blue);}
  .activity-time{margin-left:auto; color:var(--muted); font-size:11.5px; flex-shrink:0;}

  .claim-card{padding:18px 20px; display:flex; gap:16px; margin-bottom:12px; align-items:flex-start;}
  .claim-thumb{width:58px; height:58px; border-radius:10px; background:var(--purple-tint); color:var(--purple-dark); display:flex; align-items:center; justify-content:center; flex-shrink:0; overflow:hidden;}
  .claim-thumb img{width:100%; height:100%; object-fit:cover;}
  .claim-main{flex:1; min-width:0;}
  .claim-main .title{font-weight:700; font-size:15px;}
  .claim-main .sub{color:var(--muted); font-size:12.5px; margin-top:2px;}
  .claim-quote{margin-top:9px; background:var(--bg); border-radius:9px; padding:10px 12px; font-size:13px; color:var(--ink); font-style:italic;}
  .claim-btns{display:flex; gap:8px; margin-top:12px;}

  /* ---------- Messages ---------- */
  .msg-row{padding:16px 20px; border-bottom:1px solid var(--line);}
  .msg-row:last-child{border-bottom:none;}
  .msg-head{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .msg-head .who{font-weight:700; font-size:14px;}
  .msg-head .tag{font-size:10.5px; font-weight:700; text-transform:uppercase; padding:3px 8px; border-radius:6px;}
  .tag-question{background:var(--blue-tint); color:var(--blue);}
  .tag-dispute{background:var(--red-tint); color:var(--red);}
  .msg-item{color:var(--muted); font-size:12.5px; margin-top:3px;}
  .msg-body{margin-top:9px; font-size:13.5px; line-height:1.5; background:var(--bg); border-radius:9px; padding:10px 12px;}
  .msg-answer{margin-top:9px; font-size:13.5px; line-height:1.5; background:var(--purple-tint); border-radius:9px; padding:10px 12px;}
  .msg-reply{margin-top:10px; display:flex; gap:8px;}
  .msg-reply textarea{flex:1; min-height:44px;}

  /* ---------- Inbox ---------- */
  .email-row{padding:15px 20px; display:flex; gap:13px; align-items:flex-start; cursor:pointer; border-bottom:1px solid var(--line);}
  .email-row:last-child{border-bottom:none;}
  .email-row:hover{background:var(--bg);}
  .email-avatar{width:36px; height:36px; border-radius:9px; background:var(--purple); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; flex-shrink:0; font-size:13px;}
  .email-main{flex:1; min-width:0;}
  .email-main .subj{font-weight:700; font-size:14px;}
  .email-main .prev{color:var(--muted); font-size:12.5px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .email-status{font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:6px; flex-shrink:0;}
  .email-date{color:var(--muted); font-size:11.5px; flex-shrink:0;}
  .email-full{padding:24px;}
  .email-full .detail-row{display:flex; gap:10px; align-items:flex-start; margin-top:10px; font-size:13.5px;}
  .detail-icon{width:28px; height:28px; border-radius:8px; background:var(--purple-tint); color:var(--purple-dark); display:flex; align-items:center; justify-content:center; flex-shrink:0;}

  /* ---------- Tables ---------- */
  table{width:100%; border-collapse:collapse;}
  thead th{text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); padding:12px 18px; border-bottom:1px solid var(--line); font-weight:700;}
  tbody td{padding:12px 18px; font-size:13.5px; border-bottom:1px solid var(--line); vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  .row-status{font-weight:700; font-size:12px; padding:4px 10px; border-radius:6px; display:inline-block;}
  .row-thumb{width:34px; height:34px; border-radius:7px; background:var(--purple-tint); color:var(--purple-dark); display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .row-thumb img{width:100%; height:100%; object-fit:cover;}
  .cell-item{display:flex; align-items:center; gap:11px;}

  /* ---------- Donated list ---------- */
  .donated-row{display:flex; align-items:center; gap:14px; padding:13px 20px; border-bottom:1px solid var(--line);}
  .donated-row:last-child{border-bottom:none;}
  .donated-icon{width:40px; height:40px; border-radius:9px; background:var(--amber-tint); color:var(--amber); display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .donated-icon img{width:100%; height:100%; object-fit:cover;}
  .donated-main{flex:1;}
  .donated-main .n{font-weight:700; font-size:14px;}
  .donated-main .d{color:var(--muted); font-size:12px; margin-top:2px;}

  .section-title{font-size:13.5px; font-weight:700; margin:24px 0 10px; display:flex; align-items:center; gap:8px;}
  .section-title:first-child{margin-top:0;}

function load(){
  const dd = defaultData();
  let raw = null;
  try{ raw = localStorage.getItem(STORE_KEY); }catch(e){}
  if(!raw){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(dd)); }catch(e){} return dd; }
  try{
    const parsed = JSON.parse(raw);
    if(!parsed.admin) parsed.admin = dd.admin;
    if(!parsed.users) parsed.users = dd.users;
    if(!parsed.items) parsed.items = [];
    if(!parsed.messages) parsed.messages = [];
    if(!parsed.emails) parsed.emails = [];
    if(!parsed.settings) parsed.settings = dd.settings;
    if(!parsed.settings.email) parsed.settings.email = dd.settings.email;
    if(!parsed.settings.sms) parsed.settings.sms = dd.settings.sms;
    if(!parsed.branchChangeRequests) parsed.branchChangeRequests = [];
    parsed.users.forEach(u=>{ if(!u.branch) u.branch = MAIN_ADMIN_BRANCH; });
    parsed.items.forEach(i=>{ if(!i.branch) i.branch = MAIN_ADMIN_BRANCH; });
    return parsed;
  }catch(e){
    // Never overwrite saved data on a read error: keep a backup copy, then start from defaults in memory only.
    try{ localStorage.setItem(STORE_KEY + "_backup_" + Date.now(), raw); }catch(_){}
    return dd;
  }
}

/* ============================= SOUNDS =============================
   Tiny Web Audio synth (no files). 'success' is a soft two-note chime in the
   spirit of a payment confirmation; 'tap' is a quiet tick; 'error' a low blip. */
let _audioCtx = null;
function _ac(){
  try{
    if(!_audioCtx){ const C = window.AudioContext || window.webkitAudioContext; if(C) _audioCtx = new C(); }
    if(_audioCtx && _audioCtx.state === 'suspended') _audioCtx.resume();
  }catch(e){}
  return _audioCtx;
}
function _tone(freq, start, dur, vol, type){
  const ac = _ac(); if(!ac) return;
  const t0 = ac.currentTime + start;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
function playSound(kind){
  if(localStorage.getItem('lf_sound') === 'off') return;
  if(kind === 'success'){ _tone(1318.5, 0, 0.16, 0.15); _tone(1760, 0.085, 0.45, 0.17); _tone(2637, 0.085, 0.3, 0.04); }
  else if(kind === 'error'){ _tone(240, 0, 0.18, 0.11, 'triangle'); _tone(180, 0.09, 0.22, 0.09, 'triangle'); }
  else { _tone(920, 0, 0.06, 0.05); }
}
// Every button, pill, tab and clickable card makes a sound. Buttons tagged
// data-sound="success" play the chime; everything else gets the soft tap.
document.addEventListener('click', (e)=>{
  const el = e.target.closest('button, .item-card, [role="button"]');
  if(!el || el.disabled) return;
  playSound(el.dataset.sound || 'tap');
}, true);

function toast(msg, kind){
  if(kind === 'error') playSound('error');
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className='toast';
  el.innerHTML = icon(kind==='error'?'alert':'check',15) + `<span>${esc(msg)}</span>`;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='.25s'; setTimeout(()=>el.remove(),250); }, 3200);
}

/* ============================= NOTIFICATION DELIVERY =============================
   Real delivery requires provider credentials the admin configures in Settings:
   - Email: EmailJS (client-safe; https://www.emailjs.com — free tier). Needs a
     Service ID, Template ID and Public Key. Template should use variables
     to_email, item_name, location, day, time.
   - SMS: a webhook URL (e.g. a Twilio Function, Zapier/Make scenario, or your
     own small backend) that accepts a POST of {to, item_name, location, day, time}
     and sends the text message. Browsers can't call Twilio directly with a
     secret key, so a webhook is the safe pattern for a front-end-only app.
   Without these configured, messages are still logged in Inbox / Item Log so
   nothing is lost — they just aren't wired to a real inbox yet. */
async function sendClaimEmail(item){
  const cfg = DATA.settings.email;
  const emailRecord = { id: uid(), itemId: item.id, itemName: item.name, to: item.claim.email, sentDate: new Date().toISOString(), delivered:false };
  if(cfg.serviceId && cfg.templateId && cfg.publicKey && window.emailjs){
    try{
      emailjs.init({publicKey: cfg.publicKey});
      await emailjs.send(cfg.serviceId, cfg.templateId, {
        to_email: item.claim.email,
        item_name: item.name,
        location: DATA.settings.location,
        day: DATA.settings.collectDay,
        time: DATA.settings.collectTime
      });
      emailRecord.delivered = true;
      toast(`Email sent to ${item.claim.email}`);
    }catch(err){
      toast("Email provider error — logged in Inbox instead. Check Settings.", "error");
    }
  } else {
    toast(`Claim approved — logged in Inbox. Add an email provider in Settings to send real emails.`);
  }
  DATA.emails.unshift(emailRecord);
  save();
}
async function sendClaimSMS(item){
  const cfg = DATA.settings.sms;
  const phone = item.claim.phone;
  if(!phone) return;
  if(cfg.webhookUrl){
    try{
      await fetch(cfg.webhookUrl, {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ to: phone, item_name: item.name, location: DATA.settings.location, day: DATA.settings.collectDay, time: DATA.settings.collectTime })
      });
      toast(`SMS sent to ${phone}`);
    }catch(err){
      toast("SMS webhook error — check the URL in Settings.", "error");
    }
  }
}

let ROLE = "user";
let TAB = "dashboard";
let browseFilter = {cat:"All", q:""};
let branchViewFilter = "All"; // main-admin only: which branch's data to view

/* ---------- Branch scoping ---------- */
function isMainAdmin(){ return !!(SESSION && SESSION.role==="admin" && SESSION.isMainAdmin); }
function myBranch(){ return SESSION ? SESSION.branch : null; }
// What branch the current viewer is scoped to for lists — null means "see everything" (main admin only)
function effectiveBranch(){
  if(isMainAdmin()) return branchViewFilter==="All" ? null : branchViewFilter;
  return myBranch();
}
function inScope(branch){
  const eb = effectiveBranch();
  return eb===null || branch===eb;
}
function itemBranch(itemId){ const i = DATA.items.find(x=>x.id===itemId); return i ? i.branch : null; }
function branchFilterBarHtml(){
  if(!isMainAdmin()) return "";
  return `<div class="pills" id="branchFilterBar" style="margin-bottom:16px;">
    <button class="pill ${branchViewFilter==='All'?'active':''}" data-branchf="All">${t('allBranches')}</button>
    ${BRANCHES.map(b=>`<button class="pill ${branchViewFilter===b?'active':''}" data-branchf="${esc(b)}">${esc(b)}</button>`).join('')}
  </div>`;
}
function wireBranchFilterBar(){
  const bar = document.getElementById('branchFilterBar');
  if(!bar) return;
  bar.addEventListener('click', (e)=>{
    const p = e.target.closest('[data-branchf]'); if(!p) return;
    branchViewFilter = p.dataset.branchf;
    renderView();
  });
}

function tabDefs(){
  const openMsgs = DATA.messages.filter(m=>m.status==="open" && inScope(itemBranch(m.itemId))).length;
  const myOpen = SESSION && SESSION.role==="user" ? DATA.messages.filter(m=> (m.userId===SESSION.id) && m.status==="answered" && !m.seen).length : 0;
  return {
    user:[
      {id:"dashboard", label:t('tabDashboard'), ic:"home"},
      {id:"report", label:t('tabReport'), ic:"camera"},
      {id:"browse", label:t('tabMissing'), ic:"search"},
      {id:"messages", label:t('tabMyMessages'), ic:"message", badge: myOpen||null},
      {id:"inventory", label:t('tabInventory'), ic:"box"},
      {id:"donated", label:t('tabDonated'), ic:"gift"},
      {id:"settings", label:t('tabSettings'), ic:"sliders"}
    ],
    admin:[
      {id:"dashboard", label:t('tabDashboard'), ic:"home"},
      {id:"admin", label:t('tabClaims'), ic:"shield"},
      {id:"browse", label:t('tabMissing'), ic:"search", badge: (SESSION&&SESSION.role==="admin"?unseenUploads().length:0)||null},
      {id:"messages", label:t('tabMessages'), ic:"message", badge: openMsgs||null},
      {id:"inbox", label:t('tabInbox'), ic:"inbox"},
      {id:"inventory", label:t('tabInventory'), ic:"box"},
      {id:"donated", label:t('tabDonated'), ic:"gift"},
      {id:"users", label:t('tabUsers'), ic:"users"},
      {id:"settings", label:t('tabSettings'), ic:"sliders"}
    ]

function renderAuth(){
  document.body.classList.remove('authed');
  document.getElementById('view').innerHTML = AuthPage();
  wireAuthPage();
}
function wireAuthPage(){
  wireLanguagePicker('authLangSelect', renderAuth);
  const toAdmin = document.getElementById('toAdmin');
  if(toAdmin) toAdmin.addEventListener('click', ()=>{ authMode="admin"; renderAuth(); });
  const toUser = document.getElementById('toUser');
  if(toUser) toUser.addEventListener('click', ()=>{ authMode="user"; authStep="start"; renderAuth(); });
  const backBtn = document.getElementById('backToStart');
  if(backBtn) backBtn.addEventListener('click', ()=>{ authStep="start"; renderAuth(); });

  const sendBtn = document.getElementById('sendCodeBtn');
  if(sendBtn) sendBtn.addEventListener('click', ()=>{
    const name = document.getElementById('authName').value.trim();
    const contact = document.getElementById('authContact').value.trim();
    const branch = document.getElementById('authBranch').value;
    if(!name){ toast(t('errName'), "error"); return; }
    if(!contact){ toast(t('errContact'), "error"); return; }
    if(!branch){ toast(t('errBranch'), "error"); return; }
    pendingAuth = { name, contact, branch, isEmail: contact.includes('@'), code: String(Math.floor(1000+Math.random()*9000)) };
    authStep = "code";
    renderAuth();
  });
  const verifyBtn = document.getElementById('verifyCodeBtn');
  if(verifyBtn) verifyBtn.addEventListener('click', ()=>{
    const code = document.getElementById('authCode').value.trim();
    if(code !== pendingAuth.code){ toast(t('errCode'), "error"); return; }
    let user = DATA.users.find(u=> (u.email && u.email===pendingAuth.contact) || (u.phone && u.phone===pendingAuth.contact));
    let branchNote = "";
    if(!user){
      user = { id: uid(), name: pendingAuth.name, email: pendingAuth.isEmail?pendingAuth.contact:"", phone: pendingAuth.isEmail?"":pendingAuth.contact, joined: todayStr(), branch: pendingAuth.branch };
      DATA.users.push(user);
    } else {
      user.name = pendingAuth.name || user.name;
      if(user.branch !== pendingAuth.branch){
        branchNote = " " + tf('branchNote',{a:user.branch,b:pendingAuth.branch});
      }
    }
    save();
    SESSION = { role:"user", id:user.id, name:user.name, contact:pendingAuth.contact, branch:user.branch };
    saveSession(SESSION);
    toast(`${t('welcomeBack')} ${user.name}!${branchNote}`);
    startApp();
  });
  const adminBtn = document.getElementById('adminLoginBtn');
  if(adminBtn) adminBtn.addEventListener('click', ()=>{
    const email = document.getElementById('adminEmail').value.trim();
    const pass = document.getElementById('adminPass').value;
    const branch = document.getElementById('adminBranch').value;
    if(!branch){ toast(t('errBranch'), "error"); return; }
    if(email===DATA.admin.email && pass===DATA.admin.password){
      SESSION = { role:"admin", name:DATA.admin.name, contact:email, branch, isMainAdmin: branch===MAIN_ADMIN_BRANCH };
      saveSession(SESSION);
      toast(`${t('welcomeBack')} ${t('roleAdmin')} — ${branch}.`);
      startApp();
    } else {
      toast(t('errAdminLogin'), "error");
    }
  });
}

function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function startApp(){
  ROLE = SESSION.role;
  const savedBF = lsGet('lf_branchf');
  branchViewFilter = (SESSION.isMainAdmin && savedBF && (savedBF==="All" || BRANCHES.includes(savedBF))) ? savedBF : "All";
  try{ const bf = JSON.parse(lsGet('lf_browsef')||'null'); if(bf && typeof bf.q==='string' && bf.cat) browseFilter = bf; }catch(e){}
  document.documentElement.lang = getLang();
  document.body.classList.add('authed');
  refreshUserChip();
  const savedTab = lsGet('lf_tab');
  TAB = (savedTab && tabDefs()[ROLE].some(x=>x.id===savedTab)) ? savedTab : "dashboard";
  renderTabs();
  renderView();
  if(ROLE==="admin"){ const u = unseenUploads(); if(u.length){ setTimeout(()=>{ toast(tf('newUploads',{c:u.length})); playSound('success'); }, 500); } }
}
function refreshUserChip(){
  const roleLabel = SESSION.role==="admin" ? t('roleAdmin') : t('roleUser');
  document.getElementById('userChip').innerHTML = `<span class="avatar-circle">${initials(SESSION.name)}</span><span class="who-name"><span class="role-tag">${esc(roleLabel)}</span>${esc(SESSION.name)}</span>`;
  document.getElementById('logoutBtn').innerHTML = icon('x',13) + ' ' + esc(t('logout'));
}
function logout(){
  lsSet('lf_tab','dashboard');
  SESSION = null;
  saveSession(null);
  authMode = "user"; authStep = "start";
  renderAuth();
}
document.getElementById('logoutBtn').addEventListener('click', logout);

function renderTabs(){
  const wrap = document.getElementById('tabs');
  const prevScroll = wrap.scrollLeft;
  wrap.innerHTML = tabDefs()[ROLE].map(t=>`<button class="tab-btn ${TAB===t.id?'active':''}" data-tab="${t.id}" aria-current="${TAB===t.id?'page':'false'}">${icon(t.ic,15)}<span>${t.label}</span>${t.badge?`<span class="badge-dot" aria-label="${t.badge} new">${t.badge}</span>`:''}</button>`).join('');
  wrap.scrollLeft = prevScroll;
  const act = wrap.querySelector('.tab-btn.active');
  if(act && act.scrollIntoView) act.scrollIntoView({block:'nearest', inline:'nearest'});
  setTimeout(updateTabArrows, 60);
}
function updateTabArrows(){
  const w = document.getElementById('tabs'); if(!w) return;
  const l = document.getElementById('tabsLeft'), r = document.getElementById('tabsRight');
  l.classList.toggle('show', w.scrollLeft > 4);
  r.classList.toggle('show', w.scrollLeft + w.clientWidth < w.scrollWidth - 4);
}
(function(){
  const w = document.getElementById('tabs');
  w.addEventListener('scroll', updateTabArrows, {passive:true});
  window.addEventListener('resize', updateTabArrows);
  document.getElementById('tabsLeft').addEventListener('click', ()=> w.scrollBy({left:-220, behavior:'smooth'}));
  document.getElementById('tabsRight').addEventListener('click', ()=> w.scrollBy({left:220, behavior:'smooth'}));
  // mouse wheel scrolls the tabs sideways
  w.addEventListener('wheel', (e)=>{ if(Math.abs(e.deltaY) > Math.abs(e.deltaX)){ w.scrollLeft += e.deltaY; e.preventDefault(); } }, {passive:false});
})();
document.getElementById('tabs').addEventListener('click', (e)=>{
  const btn = e.target.closest('.tab-btn'); if(!btn) return;
  TAB = btn.dataset.tab;
  renderTabs();
  renderView();
  window.scrollTo({top:0});
});

function renderView(){
  const view = document.getElementById('view');
  lsSet('lf_tab', TAB); lsSet('lf_branchf', branchViewFilter); lsSet('lf_browsef', JSON.stringify(browseFilter));
  if(TAB==="dashboard") view.innerHTML = DashboardPage();
  else if(TAB==="report") view.innerHTML = ReportPage();
  else if(TAB==="browse"){ view.innerHTML = BrowsePage(); if(ROLE==="admin" && unseenUploads().length){ markUploadsSeen(); renderTabs(); } }
  else if(TAB==="admin") view.innerHTML = AdminPage();
  else if(TAB==="messages") view.innerHTML = MessagesPage();
  else if(TAB==="inbox") view.innerHTML = InboxPage();
  else if(TAB==="inventory") view.innerHTML = InventoryPage();
  else if(TAB==="donated") view.innerHTML = DonatedPage();
  else if(TAB==="users") view.innerHTML = UsersPage();
  else if(TAB==="settings") view.innerHTML = SettingsPage();
  bindViewEvents();
}
function goTab(id){ TAB=id; renderTabs(); renderView(); }

  const isAdmin = ROLE==="admin";

  const counts = {
    available: scopedItems.filter(i=>i.status==="available").length,
    pending: scopedItems.filter(i=>i.status==="pending").length,
    claimed: scopedItems.filter(i=>i.status==="claimed").length,
    donated: scopedItems.filter(i=>i.status==="donated").length

  const myReported = isAdmin ? 0 : scopedItems.filter(i=> i.reportedBy===SESSION.id).length;
  const myClaims = isAdmin ? 0 : scopedItems.filter(i=> i.claim && i.claim.by===SESSION.id).length;
  const openMsgs = DATA.messages.filter(m=> m.status==="open" && inScope(itemBranch(m.itemId))).length;
  const myPendingBranchReq = !isAdmin ? DATA.branchChangeRequests.find(r=> r.userId===SESSION.id && r.status==="pending") : null;

  const upBanner = up.length ? `<div class="card note-box note-amber" style="margin-top:0;margin-bottom:18px;align-items:center;flex-wrap:wrap;">${icon('camera',15)}<span style="flex:1;min-width:180px;">${esc(tf('newUploads',{c:up.length}))}: ${esc(up.slice(0,3).map(n=>n.itemName).join(', '))}</span><button class="btn btn-secondary btn-sm" data-goto="browse">${t('reviewNew')}</button></div>` : '';
  const statCards = isAdmin ? `
    <div class="stat-row">

      <div class="card stat"><div class="stat-icon">${icon('gift',18)}</div><div><div class="num">${counts.donated}</div><div class="lbl">${t('statDonatedLbl')}</div></div></div>

    <div class="stat-row">
      <div class="card stat"><div class="stat-icon">${icon('camera',18)}</div><div><div class="num">${myReported}</div><div class="lbl">${t('statItemsReported')}</div></div></div>
      <div class="card stat"><div class="stat-icon">${icon('tag',18)}</div><div><div class="num">${myClaims}</div><div class="lbl">${t('statYourClaims')}</div></div></div>
      <div class="card stat"><div class="stat-icon">${icon('box',18)}</div><div><div class="num">${counts.available}</div><div class="lbl">${t('statItemsAvailable')}</div></div></div>
      <div class="card stat"><div class="stat-icon">${icon('calendar',18)}</div><div><div class="num">${DATA.settings.donationDays}</div><div class="lbl">${t('statDaysBeforeDonation')}</div></div></div>
    </div>`;

  const quick = isAdmin ? [
    {id:"admin", ic:"shield", t:t('qaReviewClaims'), d:t('qaReviewClaimsD')},
    {id:"messages", ic:"message", t:t('qaMessages'), d:t('qaMessagesD')},
    {id:"browse", ic:"search", t:t('qaMissingItemsAdmin'), d:t('qaMissingItemsAdminD')},
    {id:"settings", ic:"sliders", t:t('qaSettings'), d:t('qaSettingsD')}
  ] : [
    {id:"report", ic:"camera", t:t('qaReportItem'), d:t('qaReportItemD')},
    {id:"browse", ic:"search", t:t('qaSearchMissing'), d:t('qaSearchMissingD')},
    {id:"messages", ic:"message", t:t('qaMyMessages'), d:t('qaMyMessagesD')},
    {id:"donated", ic:"gift", t:t('qaDonatedItems'), d:t('qaDonatedItemsD')}
  ];

  const activity = [...scopedItems]
    .filter(i=> i.status!=="available")
    .sort((a,b)=> (b.claim?.approvedDate||b.claim?.submittedDate||b.donatedDate||"").localeCompare(a.claim?.approvedDate||a.claim?.submittedDate||a.donatedDate||""))

  const cbBtn = document.getElementById('changeBranchBtn');
  if(cbBtn) cbBtn.addEventListener('click', openChangeBranchModal);

function openChangeBranchModal(){
  openModal(`
    <div class="modal-body">
      <button class="modal-close" id="modalCloseBtn" style="position:static; float:right;" aria-label="Close">${icon('x',14)}</button>
      <div class="eyebrow">${esc(t('prefBranch'))}</div>
      <h3>${esc(t('changeBranch'))}</h3>
      <p style="margin-top:10px; color:var(--muted); font-size:13px; line-height:1.5;">${esc(tf('regNow',{b:SESSION.branch}))}</p>
      <div class="field" style="margin-top:14px;"><label for="newBranchSelect">${esc(t('newBranch'))}</label><select id="newBranchSelect">${branchOptionsHtml()}</select></div>
      <button class="btn btn-primary btn-block" id="submitBranchChangeBtn">${icon('send',14)} ${t('sendReq')}</button>
    </div>`);
  document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
  document.getElementById('submitBranchChangeBtn').addEventListener('click', ()=>{
    const toBranch = document.getElementById('newBranchSelect').value;
    if(toBranch===SESSION.branch){ toast(t('alreadyBranch'), "error"); return; }
    DATA.branchChangeRequests.unshift({ id: uid(), userId: SESSION.id, userName: SESSION.name, fromBranch: SESSION.branch, toBranch, status:"pending", requestedDate: todayStr() });
    const user = DATA.users.find(u=>u.id===SESSION.id);
    if(user) user.pendingBranch = toBranch;
    save();
    toast(tf('reqSent',{b:toBranch}));

let pendingPhoto = null, pendingFile = null;
function compressImage(file, max, q){
  return new Promise((res, rej)=>{
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = ()=>{
      const sc = Math.min(1, max/Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.max(1,Math.round(img.naturalWidth*sc)), h = Math.max(1,Math.round(img.naturalHeight*sc));
      const c = document.createElement('canvas'); c.width=w; c.height=h;
      const x = c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,w,h); x.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}

/* ---------- Admin view of an item (Missing Items tab) ---------- */

function adminQuestionsFor(item){ return DATA.messages.filter(m=> m.itemId===item.id && m.type==="question").sort((a,b)=> (a.askedDate||"").localeCompare(b.askedDate||"")); }
function pickUsersHtml(query){

    .filter(u=> !q || u.name.toLowerCase().includes(q) || (u.email||"").toLowerCase().includes(q) || (u.phone||"").includes(q))

function adminItemBody(item, mode){

  const on = (id, fn)=>{ const el = document.getElementById(id); if(el) el.addEventListener('click', fn); };
  on('adminBackBtn', ()=> openItemModal(item.id));
  on('adminClaimedBtn', ()=> openItemModal(item.id, 'pickuser'));

    renderView();
  });

    item.status = "available"; item.claim = null;

    toast(tf('toastReopen',{n:item.name}));
    renderView();
  });
  if(mode === 'pickuser'){

      renderView();

    search.addEventListener('input', ()=>{ list.innerHTML = pickUsersHtml(search.value); });

  if(mode === 'questions'){

      btn.addEventListener('click', ()=>{
        const id = btn.dataset.qSend;
        const text = document.querySelector(`[data-q-input="${id}"]`).value.trim();

  <div class="section-title">${icon('mail',16)} ${t('emailDelivery')} <span class="cfg-badge ${emailOn?'cfg-on':'cfg-off'}">${emailOn?t('configuredLbl'):t('notConfiguredLbl')}</span></div>
  <div class="card report-form" style="max-width:480px;">
    <div class="note-box note-blue">${icon('alert',15)}<span>Uses EmailJS (free tier at emailjs.com) so notices can be sent straight from the browser, with no server needed. Create a template with variables <b>to_email, item_name, location, day, time</b>, then paste the three IDs below.</span></div>
    <div class="field"><label for="setEmailService">Service ID</label><input type="text" id="setEmailService" value="${esc(s.email.serviceId)}" placeholder="service_xxxxxxx"></div>
    <div class="field"><label for="setEmailAdminTpl">${esc(t('adminTplLbl'))}</label><input type="text" id="setEmailAdminTpl" value="${esc(s.email.adminTemplateId||'')}" placeholder="template_xxxxxxx"></div>
    <div class="field"><label for="setEmailTemplate">Template ID</label><input type="text" id="setEmailTemplate" value="${esc(s.email.templateId)}" placeholder="template_xxxxxxx"></div>
    <div class="field"><label for="setEmailKey">Public key</label><input type="text" id="setEmailKey" value="${esc(s.email.publicKey)}" placeholder="public key"></div>
    <button class="btn btn-primary" id="saveEmailBtn">${t('saveEmailBtn')}</button>
  </div>

  <div class="section-title">${icon('message',16)} ${t('smsDelivery')} <span class="cfg-badge ${smsOn?'cfg-on':'cfg-off'}">${smsOn?t('configuredLbl'):t('notConfiguredLbl')}</span></div>
  <div class="card report-form" style="max-width:480px;">
    <div class="note-box note-blue">${icon('alert',15)}<span>Browsers can't call an SMS provider like Twilio directly with a secret key. Point this at a small webhook (a Twilio Function, or a Zapier/Make scenario) that accepts a POST of <b>to, item_name, location, day, time</b> and sends the text.</span></div>
    <div class="field"><label for="setSmsWebhook">SMS webhook URL</label><input type="url" id="setSmsWebhook" value="${esc(s.sms.webhookUrl)}" placeholder="https://..."></div>
    <button class="btn btn-primary" id="saveSmsBtn">${t('saveSmsBtn')}</button>
  </div>

  <div class="section-title">${icon('shield',16)} ${t('adminAccount')}</div>
  <div class="card report-form" style="max-width:480px;">
    <div class="field"><label for="setAdminEmail">${t('adminEmailLabel')}</label><input type="text" id="setAdminEmail" value="${esc(DATA.admin.email)}"></div>
    <div class="field"><label for="setAdminPass">${t('adminPasswordLabel')}</label><input type="text" id="setAdminPass" value="${esc(DATA.admin.password)}"></div>
    <button class="btn btn-secondary" id="saveAdminBtn">${t('updateLoginBtn')}</button>
  </div>`;
}

function SettingsPage(){
  const isAdmin = ROLE==="admin";
  const pending = !isAdmin ? DATA.branchChangeRequests.find(r=> r.userId===SESSION.id && r.status==="pending") : null;
  return `
  <div class="page-head"><div><h1>${t('settingsHeading')}</h1>${isAdmin ? `<p>${t('settingsSub')}</p>` : ''}</div></div>
  <div class="card pref-card">
    <div class="pref-row"><div class="pref-label">${esc(t('prefLanguage'))}</div><div class="pref-control">${languagePickerHtml('prefLang')}</div></div>
    <div class="pref-row"><div class="pref-label">${esc(t('prefBranch'))}</div><div class="pref-control">
      ${pending
        ? `<span class="cfg-badge cfg-off">${esc(tf('movePend',{b:pending.toBranch}))}</span>`
        : `<select id="prefBranch" aria-label="Branch">${branchOptionsHtml(SESSION.branch)}</select>${isAdmin ? '' : `<button class="btn btn-primary btn-sm" id="prefBranchBtn" data-sound="success" disabled>${t('request')}</button>`}`}
    </div></div>
  </div>
  ${isAdmin ? AdminSettingsSections() : ''}`;
}
function wirePreferences(){
  wireLanguagePicker('prefLang', ()=>{ renderTabs(); refreshUserChip(); renderView(); });
  const sel = document.getElementById('prefBranch');
  if(!sel) return;
  if(ROLE === "admin"){
    sel.addEventListener('change', ()=>{
      SESSION.branch = sel.value;
      SESSION.isMainAdmin = (sel.value === MAIN_ADMIN_BRANCH);
      branchViewFilter = "All";
      saveSession(SESSION);
      refreshUserChip(); renderTabs(); renderView();
      toast(tf('nowManaging',{b:sel.value}));
    });
  } else {
    const btn = document.getElementById('prefBranchBtn');
    sel.addEventListener('change', ()=>{ btn.disabled = (sel.value === SESSION.branch); });
    btn.addEventListener('click', ()=>{
      const toBranch = sel.value;
      if(toBranch === SESSION.branch) return;
      DATA.branchChangeRequests.unshift({ id: uid(), userId: SESSION.id, userName: SESSION.name, fromBranch: SESSION.branch, toBranch, status:"pending", requestedDate: todayStr() });
      const user = DATA.users.find(u=>u.id===SESSION.id);
      if(user) user.pendingBranch = toBranch;
      save();
      toast(tf('reqSent',{b:toBranch}));
      renderView();
    });
  }
}

function wireSettingsPage(){
  wirePreferences();
  const btn = document.getElementById('saveSettingsBtn');
  if(btn) btn.addEventListener('click', ()=>{
    DATA.settings.charity = document.getElementById('setCharity').value.trim() || DATA.settings.charity;
    DATA.settings.location = document.getElementById('setLocation').value.trim() || DATA.settings.location;
    DATA.settings.collectDay = document.getElementById('setDay').value.trim() || DATA.settings.collectDay;
    DATA.settings.collectTime = document.getElementById('setTime').value.trim() || DATA.settings.collectTime;
    DATA.settings.donationDays = parseInt(document.getElementById('setDays').value,10) || DATA.settings.donationDays;
    save();
    toast(t('savedSettings'));
  });
  const ebtn = document.getElementById('saveEmailBtn');
  if(ebtn) ebtn.addEventListener('click', ()=>{
    DATA.settings.email.serviceId = document.getElementById('setEmailService').value.trim();
    DATA.settings.email.templateId = document.getElementById('setEmailTemplate').value.trim();
    DATA.settings.email.adminTemplateId = document.getElementById('setEmailAdminTpl').value.trim();
    DATA.settings.email.publicKey = document.getElementById('setEmailKey').value.trim();
    save();
    toast(t('savedEmail'));
    renderView();
  });
  const sbtn = document.getElementById('saveSmsBtn');
  if(sbtn) sbtn.addEventListener('click', ()=>{
    DATA.settings.sms.webhookUrl = document.getElementById('setSmsWebhook').value.trim();
    save();
    toast(t('savedSms'));
    renderView();
  });
  const abtn = document.getElementById('saveAdminBtn');
  if(abtn) abtn.addEventListener('click', ()=>{
    const email = document.getElementById('setAdminEmail').value.trim();
    const pass = document.getElementById('setAdminPass').value.trim();
    if(!email || !pass){ toast(t('adminEmpty'), "error"); return; }
    DATA.admin.email = email; DATA.admin.password = pass;
    save();
    toast(t('adminUpdated'));
  });
}

/* ============================= EVENT BINDING ============================= */
function bindViewEvents(){
  wireDashboardPage();
  wireReportPage();
  wireBrowsePage();
  wireAdminPage();
  wireMessagesPage();
  wireInboxPage();
  wireInventoryPage();
  wireDonatedPage();
  wireUsersPage();
  wireSettingsPage();
}

/* ============================= INIT ============================= */
if(SESSION){ startApp(); } else { renderAuth(); }
</script>
</body>
</html>
